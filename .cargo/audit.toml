# la racine (voir ses commentaires pour la justification de chaque entrée,
# AUDIT_FIXES_2026-09-03.md #17). `cargo audit` ne lit pas `deny.toml`
# (format propre à `cargo-deny`), d'où ce fichier séparé.

[advisories]
