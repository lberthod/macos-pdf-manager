    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0257",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
]
